<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Territory Map — DC Metro</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="header">
    <div class="header-brand">
      <div class="header-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
      </div>
      <div>
        <h1 class="header-title">Territory Map</h1>
        <span class="header-subtitle">DC Metro Area &middot; 24 ZIP Codes</span>
      </div>
    </div>
    <div class="header-actions">
      <span id="last-updated" class="last-updated"></span>
      <div class="search-wrapper" id="search-wrapper">
        <input type="text" id="search-input" class="search-input"
               placeholder="Search address, street, park…"
               onkeydown="handleSearchKey(event)"
               autocomplete="off">
      </div>
      <button id="search-btn" class="btn btn-icon" onclick="toggleSearch()" title="Search the map">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      <button id="refresh-btn" class="btn btn-secondary" onclick="refreshData()">
        <svg id="refresh-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        Refresh Data
      </button>
      <button id="theme-btn" class="btn btn-icon" onclick="toggleTheme()" title="Toggle dark mode">
        <svg id="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg id="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <div id="app">

    <aside id="sidebar">
      <div class="metric-tabs">
        <button class="metric-tab" data-metric="income"     onclick="setMetric('income')">Income</button>
        <button class="metric-tab"        data-metric="households" onclick="setMetric('households')">Households</button>
      </div>

      <div id="sidebar-empty" class="sidebar-empty">
        <div class="sidebar-empty-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
        </div>
        <p class="sidebar-empty-title">Select a ZIP code</p>
        <p class="sidebar-empty-text">Click any shaded area on the map to view demographic details</p>
      </div>

      <div id="sidebar-content" style="display:none">
        <div class="zip-header">
          <div class="zip-meta">
            <div class="zip-code" id="zip-code-label"></div>
            <div class="zip-location" id="zip-location-label"></div>
          </div>
          <button class="close-btn" onclick="clearSelection()" title="Close">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="metrics-grid" id="metrics-grid"></div>
        <div class="sidebar-footer">
          <p class="data-source">U.S. Census Bureau, ACS 5-Year Estimates (2023)</p>
        </div>
      </div>

      <div id="ranking-section" class="ranking-section" style="display:none">
        <div class="ranking-header">
          <span class="ranking-title">All ZIP Codes</span>
          <button class="ranking-dir-btn" id="ranking-dir-btn" onclick="toggleRanking()">↓ High → Low</button>
        </div>
        <div class="ranking-list" id="ranking-list"></div>
      </div>
    </aside>

    <div id="map-container">
      <div id="map"></div>

      <div id="tooltip" class="map-tooltip"></div>

      <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <p class="loading-text" id="loading-text">Loading territory data&hellip;</p>
      </div>

      <div id="legend" class="legend"></div>
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/chroma-js@2.4.2/chroma.min.js"></script>
  <script src="app.js?v=15"></script>
</body>
</html>
